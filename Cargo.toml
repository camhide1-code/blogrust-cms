[package]
name = "blogrust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
pulldown-cmark = "0.12"
rhai = "1.21"


