<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="roundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Buitenste ronde badge -->
  <circle cx="80" cy="80" r="76" fill="url(#roundGrad)" stroke="#fff7ed" stroke-width="4"/>
  <!-- Tandwiel-ring (Rust stijl) -->
  <circle cx="80" cy="80" r="64" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="10 7" opacity="0.9"/>
  <!-- Binnenste donkere cirkel -->
  <circle cx="80" cy="80" r="52" fill="url(#innerGrad)"/>
  <!-- Download pijl icoon in het midden -->
  <path d="M80 44 v34 M65 66 l15 15 l15 -15" fill="none" stroke="#fb923c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Basisbalkje onder de pijl -->
  <path d="M60 94 h40" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- Tekst in de ronde badge -->
  <text x="80" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1.2">DOWNLOAD</text>
  <text x="80" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#fff7ed" letter-spacing="1.5">BLOGRUST</text>
</svg>
